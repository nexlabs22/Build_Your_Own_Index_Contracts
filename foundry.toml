[profile.default]
# Project layout
src = "src"
out = "out"
libs = ["lib"]


auto_detect_solc = false
optimizer = true
optimizer_runs = 200

# Required by openzeppelin-foundry-upgrades
ffi = true
build_info = true
ast = true
extra_output = ["storageLayout"]

# Allow the upgrades validator to read build-info from ./out
fs_permissions = [{ access = "read", path = "./out" }]

# Useful remappings (adjust if your lib paths differ)
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
]
