name: Contracts CI

on:
  push:
  pull_request:
    
permissions:
  contents: read
  pull-requests: write

env:
  FOUNDRY_PROFILE: ci

jobs:
  formatting-lint:
    name: Formatting & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: ~/.foundry
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml') }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1


      - name: Check Forge formatting
        run: forge fmt --check

      - name: Install solhint
        run: npm install -g solhint

      - name: Run solhint
        run: solhint 'src/**/*.sol' --max-warnings 0 || (echo "Solhint failed" && exit 1)

  build:
    name: Build
    needs: formatting-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          submodules: recursive

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: ~/.foundry
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml') }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1


      - name: Forge build (sizes)
        run: forge build --sizes

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          submodules: recursive

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: ~/.foundry
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml') }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1


      - name: Run unit tests
        run: forge test -vv --fail-fast
