name: Contracts Unit Tests

on:
  push:
  pull_request:

concurrency:
  group: contracts-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FOUNDRY_PROFILE: ci

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          submodules: recursive

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: ~/.foundry
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml') }}

      - name: Install Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          # Add foundryup to PATH for the current runner session
          export PATH="$HOME/.foundry/bin:$PATH"
          foundryup
          forge --version  # verify installation


      - name: Run unit tests
        run: forge test -vv --fail-fast
