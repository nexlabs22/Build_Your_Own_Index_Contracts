name: Contracts CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [ main, develop, CI/CD ]
  workflow_dispatch:

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FOUNDRY_PROFILE: ci
  # You can set additional env vars here if needed (e.g. RPC URLs via secrets in future)

jobs:
  formatting-lint:
    name: Formatting & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: ~/.foundry
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml') }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: latest

      - name: Check Forge formatting
        run: forge fmt --check

      - name: Install solhint
        run: npm install -g solhint

      - name: Run solhint
        run: solhint 'src/**/*.sol' --max-warnings 0 || (echo "Solhint failed" && exit 1)

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: formatting-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: ~/.foundry
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml') }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge build (sizes)
        run: forge build --sizes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-build-out
          path: |
            out/
            cache/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: ~/.foundry
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml') }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run unit tests
        run: forge test -vv --fail-fast --no-match-test Integration

      - name: Gas snapshot (JSON)
        run: forge snapshot --json > gas-snapshot.json || echo '{}' > gas-snapshot.json

      - name: Upload gas snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-snapshot
          path: gas-snapshot.json

  integration-tests:
    name: Integration Tests (Anvil)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: ~/.foundry
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml') }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start Anvil
        run: |
          nohup anvil --block-time 1 --silent > anvil.log 2>&1 &
          sleep 3

      - name: Run integration tests (matching 'Integration')
        run: forge test -vv --match-test Integration

      - name: Upload Anvil log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anvil-log
          path: anvil.log

  coverage:
    name: Coverage (PR only)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: ~/.foundry
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml') }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run coverage (lcov)
        run: forge coverage --report lcov

      - name: Upload coverage lcov
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  static-analysis:
    name: Slither (on label run-slither)
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-slither')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python & Slither deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip install slither-analyzer crytic-compile

      - name: Run Slither
        run: slither . --exclude-informational --exclude-low --fail-high --fail-medium || true

      - name: Archive Slither report (stdout capture)
        if: always()
        run: slither . > slither-report.txt || echo "Slither run issue" > slither-report.txt

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: slither-report.txt

# Notes:
# - Integration tests rely on naming pattern 'Integration' in test function names.
# - Add a label 'run-slither' to a PR to activate static-analysis job.
# - Future enhancements: gas delta comparison vs main, PR comments, coverage threshold enforcement.